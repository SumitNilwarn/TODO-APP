# Todo App frontend — nginx configuration for Flutter Web SPA.
#
# Serves the static Flutter Web build and falls back to /index.html for
# client-side routes so browser refresh / deep links never return a 404.
#
# Routes that MUST resolve to index.html:
#   /  /login  /register  /profile  /dashboard  /tasks  /tasks/{id}
#   /design-system
#
# The browser talks to the backend at http://localhost:8080 (host-published);
# this nginx only proxies nothing — it is a pure static web server.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static Flutter Web assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
        application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        # Flutter Web out-of-the-box SPA fallback.
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; index.html is never cached so route
    # refreshes pick up new builds.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
