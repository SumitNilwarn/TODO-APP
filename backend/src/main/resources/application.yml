spring:
  application:
    name: todo-app-backend

  datasource:
    # Production runs on the Neon-managed database; its credentials are
    # provisioned by the Vercel Neon integration (TODO_DB_*). The DB_* entries
    # remain the local-dev contract (see .env.example) and serve as fallback.
    url: jdbc:postgresql://${TODO_DB_PGHOST:${DB_HOST:localhost}}:${DB_PORT:5432}/${TODO_DB_PGDATABASE:${DB_NAME:todo_app}}?sslmode=${DB_SSLMODE:prefer}
    username: ${TODO_DB_PGUSER:${DB_USERNAME:todo_app}}
    password: ${TODO_DB_PGPASSWORD:${DB_PASSWORD:todo_app}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TodoAppHikariPool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.todoapp: INFO
    org.hibernate: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5p [%thread] [%X{correlationId:-}] %-40.40logger{39} : %msg%n"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

  tasks:
    # Hard cap for GET /api/v1/tasks?size=... — prevents unbounded result sets.
    max-page-size: ${TASKS_MAX_PAGE_SIZE:100}

  security:
    jwt:
      # HMAC-SHA256 signing key (at least 32 characters). MUST be overridden via
      # JWT_SECRET in every real environment; the value below is a disposable
      # local-development default only and is never used in tests.
      secret: ${JWT_SECRET:todo-app-local-development-jwt-secret-change-me}
      issuer: ${JWT_ISSUER:todo-app}
      access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
      refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000}