# ===========================================================================
# CI — Todo App (Phase 19)
#
# Automated quality gates for:
#   backend   Java 21 / Maven / Spring Boot / Testcontainers PostgreSQL 16
#   frontend  Flutter 3.47.4 / Dart 3.13.3 / analyze + test + web build
#   docker    Dockerfiles + Docker Compose config validation
#
# Triggers: push and pull_request (all branches).
# Concurrency: superseded runs for the same ref are cancelled.
# Permissions: contents: read (least privilege).
# ===========================================================================

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Backend — Java 21, Maven Wrapper, Testcontainers PostgreSQL 16
  # -------------------------------------------------------------------------
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure Maven Wrapper is executable
        run: chmod +x mvnw

      - name: Maven verify
        run: ./mvnw -B verify

  # -------------------------------------------------------------------------
  # Frontend — Flutter 3.47.4, format + analyze + test + web build
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend (Flutter 3.47.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Dart format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

      - name: Flutter test
        run: flutter test --concurrency 8

      - name: Flutter web build
        run: flutter build web --dart-define=API_BASE_URL=http://localhost:8080

  # -------------------------------------------------------------------------
  # Docker — Compose config + Dockerfile builds
  # -------------------------------------------------------------------------
  docker:
    name: Docker (Compose + image builds)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        working-directory: infrastructure
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build -t todo-app-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t todo-app-frontend:ci ./frontend
